name: PR Automation

on:
  pull_request:
    types: [opened, review_requested, closed, edited, reopened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  # 1. Generate summary and new PR title
  summarize-and-rename:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install @octokit/rest diff
      - name: Summarize and Rename
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node <<'EOF'
          const { Octokit } = require("@octokit/rest");
          const octokit = new Octokit({ auth: process.env.GITHUB_TOKEN });
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split("/");
          const prNumber = parseInt(process.env.PR_NUMBER, 10);

          (async () => {
            try {
              const { data: pr } = await octokit.pulls.get({ owner, repo, pull_number: prNumber });
              const { data: files } = await octokit.pulls.listFiles({ owner, repo, pull_number: prNumber });
              
              // 1. Generate Summary
              let changes = '### Changes\n';
              for (const f of files.slice(0, 10)) {
                if (f.patch) changes += `**${f.filename}**: Updated logic.\n`;
              }
              const summary = `## PR Summary\n\nAutomated summary of changes.\n\n${changes}`;
              
              // 2. Fix Title (Capitalize)
              let newTitle = pr.title;
              if (pr.title.includes(':')) {
                const parts = pr.title.split(':');
                let subject = parts[1].trim();
                newTitle = `${parts[0].trim().toLowerCase()}: ${subject.charAt(0).toUpperCase() + subject.slice(1)}`;
              }

              const updateData = { owner, repo, pull_number: prNumber, body: (pr.body || '').split('## PR Summary')[0] + summary };
              if (pr.title !== newTitle) updateData.title = newTitle;
              
              await octokit.pulls.update(updateData);
            } catch (e) { console.error(e); }
          })();
          EOF

  # 2. Check title (Final verification)
  check-title:
    needs: [summarize-and-rename]
    if: always() && github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            style
            refactor
            perf
            test
            build
            ci
          subjectPattern: ^(?![a-z]).+$

  # 3. Notify Telegram (Sequenced for PRs, Independent for Comments)
  notify-telegram:
    needs: [check-title]
    if: always() && (github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request))
    runs-on: ubuntu-latest
    steps:
      - name: Send Notification
        uses: EverythingSuckz/github-telegram-notify@main
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: |
            *${{ github.event_name == 'issue_comment' && 'Comment on Pull Request' || 'Pull Request Update' }}*
            Event: ${{ github.event_name == 'issue_comment' && 'commented' || (github.event.pull_request.merged && 'merged' || github.event.action) }}
            Repository: [${{ github.repository }}](https://github.com/${{ github.repository }})
            By: ${{ github.actor }}
            
            ${{ github.event_name == 'issue_comment' && format('Comment: {0}', github.event.comment.body) || format('PR: [{0}]({1})', github.event.pull_request.title, github.event.pull_request.html_url) }}
            ${{ github.event_name == 'issue_comment' && format('URL: {0}', github.event.comment.html_url) || format('Commit: {0}', github.event.pull_request.head.sha) }}
